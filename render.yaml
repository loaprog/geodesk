services:
  - type: web
    name: geodesk
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /login

    envVars:
      - key: APP_NAME
        value: GeoDesk

      - key: APP_ENV
        value: production

      - key: SECRET_KEY
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: ADMIN_USERNAME
        value: admin

      - key: ADMIN_PASSWORD
        sync: false

      - key: SESSION_COOKIE_NAME
        value: webgis_session

      - key: MAPBOX_TOKEN
        sync: false